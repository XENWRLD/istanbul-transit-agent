# Elle doğrulanmış raylı sistem servis saatleri.
#
# Bu dosya GTFS'in (Public Transport GTFS, veri seti 308, 09.07.2020) ÖNÜNE
# geçer. Burada tanımlı bir hattın ilk/son sefer saatleri YALNIZCA bu
# dosyadan okunur; o hat için GTFS'teki ilk/son sefer saatleri hiç
# kullanılmaz ve cevap `hours_is_stale: false` döner.
#
# Sefer aralığı ayrı bir şey: burada `aralik` tanımlı değilse aralık hâlâ
# GTFS'ten ölçülür ve `headway_is_stale: true` döner. Çıktıda ikisi ayrı
# gösterilir (karar 0005, karar 8).
#
# Saatler hattın UÇ İSTASYONLARI içindir. Ara istasyonların ilk/son seferi,
# uç istasyondan o istasyona kadarki sefer süresi (`rail_segments`) kadar
# kaydırılarak hesaplanır.
#
# Gün tipleri: pzt_pers (Pazartesi-Perşembe), cuma, cumartesi, pazar.
# `gece_boyunca: true` o gece servisin kesilmediğini söyler; son sefer
# verilmez, gece sefer aralığı bilinmiyorsa cevap bunu açıkça belirtir.
#
# Alanlar:
#   source_type   kaydın nereden geldiği (user_provided | operator | ...)
#   retrieved_at  bilginin alındığı tarih
#   aliases       aynı fiziksel hattın beslemedeki diğer kodları
#   yonler        yön bazında farklı saatler (Marmaray); yoksa saatler her
#                 iki yön için de geçerlidir ve her yön kendi uç
#                 istasyonundan ölçülür
lines:
